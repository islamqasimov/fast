#cloud-config
# Bu fayl hər VM ilk dəfə açılanda avtomatik işə düşür.
# Məqsəd: Ansible-ın işləyə bilməsi üçün minimum baza (Python, Docker) hazır olsun.

package_update: true
package_upgrade: true

packages:
  - python3
  - python3-pip
  - ca-certificates
  - curl
  - gnupg
  - git
  - ufw

runcmd:
  # Docker rəsmi repo əlavə et
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
  - usermod -aG docker ubuntu

  # Wazuh Indexer üçün lazım olan sistem parametri (rəsmi tələb)
  - sysctl -w vm.max_map_count=262144
  - echo "vm.max_map_count=262144" >> /etc/sysctl.conf

  # UFW ilə əlavə lokal firewall (OCI Security List-ə əlavə qat)
  - ufw allow OpenSSH
  - ufw allow 443/tcp
  - ufw allow 1514/tcp
  - ufw allow 1515/tcp
  - ufw --force enable

final_message: "Cloud-init tamamlandi. VM Ansible ucun hazirdir."
