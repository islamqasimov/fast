<!--
  STUB ossec.manager.conf - Phase 1 demo placeholder.

  This file exists only so docker-compose can bind-mount a real file at
  /var/ossec/etc/ossec.conf and the Wazuh manager entrypoint sed-edit
  step succeeds. It enables the minimum required for wazuh-analysisd
  to start: loopback whitelist, plus the rules/ and decoders/ dirs so
  Elmir's custom rules and decoders can be mounted in. The manager
  listens on :1514 by default; no <server> block is needed at this level
  (csyslogd rejects top-level <server> as invalid - it only belongs
  inside <agent_config>).

  TODO [T2.1 / L2 / Elmir]: replace this stub with the full manager
  config (FIM policies, syscheck, integrations, custom rules,
  active-response, etc.). This stub intentionally ships with NO
  detection rules; detections come from etc/rules.d/.

  Cross-lane note: L1 (Islam) ships this stub so the demo VM can boot
  before T2.1 lands. It must be reviewed by Elmir before any release.
-->
<ossec_config>
  <global>
    <white_list>127.0.0.1</white_list>
    <white_list>^localhost$</white_list>
  </global>

  <rules>
    <included_dir>rules</included_dir>
    <included_dir>decoders</included_dir>
  </rules>
</ossec_config>
